<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digitale Grenzverhandlung</title>
<meta name="theme-color" content="#9b1b22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="retro.css">
</head>
<body class="is-start">

<!-- App-Kopf (in der Verhandlung) -->
<header class="topbar" id="topbar">
  <button id="btn-home" class="icon-btn" type="button" aria-label="Zur Verhandlungsauswahl" title="Zur Verhandlungsauswahl">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="logo-chip"><img src="assets/logo.png" alt="Vermessung ADP Rinner" width="132" height="39"></span>
  <div class="topbar-title">
    <strong id="topbar-gz">GZ</strong>
    <span id="topbar-sub" class="muted"></span>
  </div>
  <button id="btn-docs" class="btn docs-btn" type="button" title="Angebot, Einladungen und andere Unterlagen">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 3h8l4 4v12H8zM16 3v4h4M4 7v14h12M11 11h6M11 15h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="docs-label">Unterlagen</span><span id="docs-count" class="docs-count" hidden></span>
  </button>
  <button id="btn-fotos" class="btn docs-btn" type="button" title="Fotos aufnehmen (gehen ins Büro, nicht ins Protokoll)">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="docs-label">Fotos</span><span id="fotos-count" class="docs-count" hidden></span>
  </button>
  <span id="topbar-status" class="pill"></span>
  <span id="net" class="net" title="Netzstatus"><span class="dot"></span><span class="net-label">online</span></span>
</header>

<div class="shell">
  <nav id="stepper" class="stepper" aria-label="Ablauf der Grenzverhandlung"></nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<footer id="actionbar" class="actionbar" hidden>
  <button id="btn-back" class="btn ghost" type="button">Zurück</button>
  <span id="actionbar-hint" class="muted"></span>
  <button id="btn-next" class="btn primary" type="button">Weiter</button>
</footer>

<!-- PDF-Ansicht für Behelfe und Skizze -->
<div id="viewer" class="viewer" hidden>
  <div class="viewer-bar">
    <button id="v-close" type="button" class="btn">Fertig</button>
    <strong id="v-title" class="v-title"></strong>
    <div class="v-pages" id="v-pagenav">
      <button id="v-prev" type="button" class="btn icon" aria-label="Vorherige Seite">‹</button>
      <span id="v-pageinfo">1 / 1</span>
      <button id="v-next" type="button" class="btn icon" aria-label="Nächste Seite">›</button>
    </div>
    <button id="v-searchbtn" type="button" class="btn" aria-expanded="false" title="Text im PDF suchen" aria-label="Text im PDF suchen"><span aria-hidden="true">🔍</span><span class="v-lbl"> Suchen</span></button>
    <div class="v-zoom">
      <button id="v-zoomout" type="button" class="btn icon" aria-label="Verkleinern">−</button>
      <span id="v-zoomlabel">100 %</span>
      <button id="v-zoomin" type="button" class="btn icon" aria-label="Vergrößern">+</button>
      <button id="v-fit" type="button" class="btn">Ganzes Blatt</button>
    </div>
  </div>
  <form id="v-search" class="viewer-search" hidden role="search">
    <input id="v-q" type="search" placeholder="Text suchen, z. B. Name, Gst.Nr., Uhrzeit" aria-label="Text im PDF suchen" autocomplete="off">
    <button type="submit" class="btn primary">Suchen</button>
    <button id="v-sprev" type="button" class="btn icon" aria-label="Vorheriger Treffer" disabled>‹</button>
    <span id="v-shits" class="muted" aria-live="polite"></span>
    <button id="v-snext" type="button" class="btn icon" aria-label="Nächster Treffer" disabled>›</button>
  </form>
  <div id="v-tools" class="viewer-tools" hidden>
    <div class="seg big" role="group" aria-label="Werkzeug">
      <button type="button" data-tool="pen" class="on" title="Stift: freihand zeichnen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Stift</span></button>
      <button type="button" data-tool="line" title="Linie: ziehen und loslassen, rastet an Linienenden ein"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5M5 19h.01M19 5h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/></svg><span>Linie</span></button>
      <button type="button" data-tool="erase" title="Radierer: Strich antippen löscht ihn ganz"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l8-8 6 6-5 5H8zM13 19h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Radierer</span></button>
    </div>
    <div class="seg big colors" role="group" aria-label="Farbe">
      <button type="button" data-color="#111111" class="swatch" style="--sw:#111111" aria-label="Schwarz" title="Schwarz"></button>
      <button type="button" data-color="#d0021b" class="swatch on" style="--sw:#d0021b" aria-label="Rot" title="Rot"></button>
      <button type="button" data-color="#0b57d0" class="swatch" style="--sw:#0b57d0" aria-label="Blau" title="Blau"></button>
      <button type="button" data-color="#1e8e3e" class="swatch" style="--sw:#1e8e3e" aria-label="Grün" title="Grün"></button>
    </div>
    <div class="seg big" role="group" aria-label="Strich">
      <button type="button" data-width="fein" class="on" title="feiner Strich" aria-label="fein"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button type="button" data-width="dick" title="dicker Strich" aria-label="dick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg></button>
      <button type="button" id="v-dash" title="gestrichelt, z. B. für strittige Grenzen" aria-label="gestrichelt" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h16" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 3"/></svg></button>
    </div>
    <span class="v-hist">
      <button id="v-undo" type="button" class="btn" disabled title="Rückgängig"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Zurück</span></button>
      <button id="v-redo" type="button" class="btn" disabled title="Wiederholen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vor</span></button>
    </span>
  </div>
  <div id="v-stage" class="viewer-stage">
    <div id="v-sheet" class="sheet">
      <canvas id="v-pdf"></canvas>
      <canvas id="v-ink"></canvas>
      <canvas id="v-detail" hidden></canvas>
    </div>
    <div id="v-hint" class="v-hint" hidden></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="file-zip" type="file" accept=".zip,application/zip" hidden>
<input id="file-signed" type="file" accept="application/pdf,.pdf" hidden>

<script src="libs/pdf.min.js"></script>
<script src="libs/pdf-lib.min.js"></script>
<script src="libs/jszip.min.js"></script>
<script src="libs/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
